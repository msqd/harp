# HARP configuration for cache-tests E2E testing
# This configures HARP as a reverse proxy to the cache-tests origin server

applications:
  - proxy
  - http_client
  - storage

# Uses default in-memory SQLite storage
# storage: {}

http_client:
  cache:
    enabled: true
    # Uses default policy: hishel.SpecificationPolicy (RFC 9111 compliant)
    # Uses default options: shared=true, supported_methods=[GET, HEAD], allow_stale=false

proxy:
  endpoints:
    - name: cache-tests
      description: "Reverse proxy to cache-tests origin server"
      port: 4000
      url: "http://localhost:8000/"
