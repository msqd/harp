# HARP configuration for the RFC 9111 compliance suite (see README.md).
#
# The proxy endpoint is NOT declared here: `run-tests.sh` passes it with `--endpoint`, so the ports
# live in one place and can be moved with CACHE_TESTS_PROXY_PORT / CACHE_TESTS_ORIGIN_PORT. Declaring
# it here as well makes HARP refuse to start, with "Endpoint «cache-tests» already exists".
#
# `storage.url` below is a file rather than HARP's `:memory:` default, so what the cache stored can be
# inspected after the run. `run-tests.sh` overrides it with an absolute path under `results/`.

# The application set is restricted here, so the suite runs without the dashboard and does not bind
# a second port it has no use for.
applications:
  - http_client
  - http_cache
  - proxy
  - storage

http_client: { }

http_cache: { }

storage:
  url: "sqlite+aiosqlite:///./results/storage.db"
