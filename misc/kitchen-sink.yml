proxy.endpoints:
  - port: 4000
    name: httpbin
    url: http://httpbin.org
  - port: 4001
    name: httpbin2
    url: http://httpbin.org
  - port: 4002
    name: httpbin3
    url: http://httpbin.org
  - name: httpbin4
    url: http://httpbin.org


rules:
  "httpbin":
    "GET /spec.json":
      on_remote_response: |
        response.headers['Cache-Control'] = 'max-age=1664'
    "GET /image":
      on_response: |
        transaction.markers.add("skip-response-storage")
