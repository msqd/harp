proxy:
  endpoints:
    # proxy1: Primary pool (api1, api2) with fallback to api3, api4
    - name: proxy1
      port: 4000
      remote:
        min_pool_size: 2
        endpoints:
          - { url: "http://api1/" }
          - { url: "http://api2/" }
          - { url: "http://api3/", pools: [fallback] }
          - { url: "http://api4/", pools: [fallback] }
        probe:
          method: GET
          path: "/get"
          interval: 5
        break_on: [network_error]

    # proxy2: Primary pool (api3, api4) with fallback to api1, api2
    - name: proxy2
      port: 4001
      remote:
        min_pool_size: 2
        endpoints:
          - { url: "http://api3/" }
          - { url: "http://api4/" }
          - { url: "http://api1/", pools: [fallback] }
          - { url: "http://api2/", pools: [fallback] }
        probe:
          method: GET
          path: "/get"
          interval: 5
        break_on: [network_error]
