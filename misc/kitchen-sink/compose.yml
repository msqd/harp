services:
  # API services - one container each with direct port exposure
  # USE_REAL_HOSTNAME=1 enables the /hostname endpoint to return the actual container hostname
  # PORT=80 simplifies internal docker network URLs (api1:80 instead of api1:8080)

  api1:
    image: mccutchen/go-httpbin:latest
    networks:
      - kitchen-sink
    ports:
      - "8001:80"
    environment:
      - PORT=80
      - MAX_DURATION=10s
      - MAX_BODY_SIZE=1048576
      - USE_REAL_HOSTNAME=1

  api2:
    image: mccutchen/go-httpbin:latest
    networks:
      - kitchen-sink
    ports:
      - "8002:80"
    environment:
      - PORT=80
      - MAX_DURATION=10s
      - MAX_BODY_SIZE=1048576
      - USE_REAL_HOSTNAME=1

  api3:
    image: mccutchen/go-httpbin:latest
    networks:
      - kitchen-sink
    ports:
      - "8003:80"
    environment:
      - PORT=80
      - MAX_DURATION=10s
      - MAX_BODY_SIZE=1048576
      - USE_REAL_HOSTNAME=1

  api4:
    image: mccutchen/go-httpbin:latest
    networks:
      - kitchen-sink
    ports:
      - "8004:80"
    environment:
      - PORT=80
      - MAX_DURATION=10s
      - MAX_BODY_SIZE=1048576
      - USE_REAL_HOSTNAME=1

networks:
  kitchen-sink:
    driver: bridge
