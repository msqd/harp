[package]
name = "harp-native"
version = "0.12.0-dev0"
edition = "2021"
publish = false

[lib]
name = "harp_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py313", "extension-module"] }
sha1 = "0.11"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
