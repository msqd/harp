[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "harp-proxy"
version = "0.12.0.dev0"
description = "HARP is an API Runtime Proxy, a toolkit to enhance the speed, reliability and observability of external APIs."
authors = [{ name = "Romain Dorgueil", email = "romain@makersquad.fr" }]
requires-python = ">=3.13,<3.14"
readme = "README.rst"
dependencies = [
    "aiohttp>=3.14.3,<3.15",
    "aiosqlite>=0.20,<0.22",
    "alembic>=1.17,<1.18",
    "asgi-prometheus>=1.2,<1.3",
    "asgi-tools>=1.3,<1.4",
    "asgimiddlewarestaticfile>=0.6,<0.7",
    "asgiref>=3.10,<3.13",
    # Imported directly (harp.commandline). 9.0 removes BaseCommand, which we cast to.
    "click>=8.1,<9",
    "colorama>=0.4,<0.5",
    "dataclasses-json>=0.6,<0.7",
    "dataclasses-jsonschema>=2.16,<2.17",
    "essentials-configuration>=2.0,<2.1",
    # Capped below 1.1.10: it regresses the RFC 9111 suite (conditional-etag-vary-headers-mismatch, see #869).
    "hishel>=1.1.7,<1.1.10",
    "http-router>=5.0,<6.0",
    # Imported directly (harp.utils.urls, http_cache). httpx 0.28 itself requires httpcore 1.*.
    "httpcore>=1.0,<2",
    "httpx>=0.27,<0.29",
    "hypercorn>=0.17,<0.18",
    "multidict>=6.9.1,<7",
    "orjson>=3.11,<3.12",
    # Deliberately unbounded above: packaging is a PyPA core utility much of the
    # environment also depends on, and a cap on it propagates to co-installed
    # packages. We use two frozen names from it (Version, InvalidVersion).
    "packaging>=23.2",
    "passlib>=1.7,<1.8",
    # Imported directly (harp_apps.metrics, harp.commandline.server).
    "prometheus-client>=0.20,<1",
    "pydantic>=2.12,<2.13",
    "pyheck>=0.1,<0.2",
    "pyyaml>=6.0,<6.1",
    "redis>=5.2,<8.1",
    "rich>=14.0,<15",
    "rich-click>=1.9,<1.10",
    "rodi>=2.0,<2.1",
    "sentry-sdk>=2.18,<3.0",
    "slack-sdk>=3.37,<3.38",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "sqlalchemy-utils>=0.42,<0.43",
    "structlog>=25,<27",
    "svix-ksuid>=0.6,<0.7",
    "whistle>=2.0.1,<3",
]

[project.optional-dependencies]
mysql = [
    "aiomysql>=0.2,<0.4",
    "cryptography>=50.0,<51",
]
postgresql = ["asyncpg>=0.30,<0.31"]
native = ["harp-proxy-native==0.12.0.dev0"]
# Alternative ASGI servers, see `harp server --server`.
servers = ["uvicorn[standard]>=0.30", "uvloop>=0.21", "granian>=2.0"]

[project.scripts]
harp-proxy = "harp.commandline:entrypoint"
harp = "harp.commandline:entrypoint"

[dependency-groups]
dev = [
    "cookiecutter>=2.6,<2.7",
    "freezegun>=1.5.5,<2",
    "furo>=2023.9.10,<2026.0.0",
    "hatchling==1.27.0",
    "harp-proxy[mysql,postgresql]",
    "honcho>=2.0,<2.1",
    "jscc>=0.3.0,<0.4",
    "jsonpointer>=3.0.0,<4",
    "jsonref>=1.1.0,<2",
    "myst-parser>=4.0.0,<6",
    "pre-commit>=3.7.1,<5.0.0",
    "psycopg2-binary>=2.9,<2.10",
    "pytest-asyncio>=1.3,<1.4",
    "pytest-cov>=7.0,<7.1",
    "pytest-timeout>=2.3.1,<3",
    "pytest-xdist[psutil]>=3.6.1,<4",
    "pytest>=7.4.3,<10",
    "respx>=0.20.2,<0.23.0",
    "ruff>=0.14,<0.15",
    "sphinx",
    "sphinx-autobuild>=2025.8.25,<2026.0.0",
    "sphinx-click>=6.0.0,<7",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinx-design>=0.6.0,<0.7",
    "sphinx-docsearch>=0.0.7,<0.3.2",
    "sphinx-sitemap>=2.6.0,<3",
    "sphinx-tags>=0.4,<0.5",
    "sphinxcontrib-jquery~=4.1",
    "syrupy>=5.0,<5.1",
    "testcontainers[postgres]>=4.7,<4.14",
    "towncrier>=26.9.0",
    "watchfiles>=1.1,<1.3",
]
bench = ["pyperf>=2.8,<3"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
harp-proxy-native = { path = "native" }

[tool.hatch.build.targets.sdist]
include = [
    "harp",
    "harp_apps",
    "harp_apps/dashboard/web",
]
exclude = [
    "**/node_modules/",
    "harp_apps/dashboard/frontend",
]

[tool.hatch.build.targets.sdist.force-include]
"harp_apps/dashboard/web" = "harp_apps/dashboard/web"

[tool.hatch.build.targets.wheel]
include = [
    "harp",
    "harp_apps",
]
exclude = [
    "**/node_modules/",
    "harp_apps/dashboard/frontend",
    # Test code and dev-only utilities: not needed to run HARP in production.
    "**/tests/",
    "**/test_*.py",
    "**/*_test.py",
    "**/testing/",
    "**/conftest.py",
    "**/__snapshots__/",
    "**/__pycache__/",
    "**/*.pyc",
    # Keep the project scaffolding shipped by `harp create project`: the
    # cookiecutter template legitimately contains tests/ and conftest.py that
    # end up in the user's generated project.
    "!harp/commandline/cookiecutters/**",
]

[tool.hatch.build.targets.wheel.force-include]
"harp_apps/dashboard/web" = "harp_apps/dashboard/web"

[tool.ruff]
line-length = 120
exclude = [
    "harp/commandline/cookiecutters",
    "**/node_modules/",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["harp"]
known-third-party = ["asgiref", "httpx", "rich", "structlog", "sqlalchemy", "whistle", "config", "rodi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'crypt' is deprecated:DeprecationWarning",
    "ignore:Deprecated call to:DeprecationWarning",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
markers = [
    "subprocess",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "--ignore harp/commandline/cookiecutters --ignore bench"

[tool.towncrier]
directory = "changelog.d"
filename = "docs/changelogs/unreleased.rst"
template = "docs/changelogs/towncrier.rst.j2"
title_format = false
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "important"
name = "Important Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true
