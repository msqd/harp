[project]
name = "{{cookiecutter.__pkg_name}}"
version = "0.1.0"
description = ""
authors = [
    {name = {{ cookiecutter.author_name | tojson }}, email = {{ cookiecutter.author_email | tojson }}},
]
readme = "README.rst"
requires-python = ">=3.13,<3.14"
dependencies = [
    "{{cookiecutter.__harp_requirement}}",
]

{%- if cookiecutter.__harp_source %}

[tool.uv.sources]
harp-proxy = { path = {{ cookiecutter.__harp_source | tojson }}, editable = true }
{%- endif %}

[dependency-groups]
dev = [
    "watchfiles",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
{%- if not cookiecutter.create_application %}

[tool.hatch.build.targets.wheel]
only-include = ["README.rst"]
{%- endif %}

[tool.pytest.ini_options]
testpaths = ["tests"]
