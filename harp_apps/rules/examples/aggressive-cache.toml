# Force a one hour cache on anonymous GET responses only. Requests carrying "Authorization" or "Cookie", responses setting a cookie, and
# responses the upstream marked "private", are left alone: the HTTP cache is shared (see the "shared cache" warning
# in the HTTP cache documentation).
[rules."*"."GET *"]

# language=python
on_remote_response = """
cache_control = response.headers.get('Cache-Control', '').lower()
if 'Authorization' not in request.headers and 'Cookie' not in request.headers and 'Set-Cookie' not in response.headers and 'private' not in cache_control:
    response.headers['Cache-Control'] = 'max-age=3600'
"""
