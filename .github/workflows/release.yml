name: Release

on:
  push:
    tags:
      - '*.*.*'      # Semantic version tags (e.g., 0.9.0)
      - '*.*.*-*'    # Pre-release tags (e.g., 0.9.0-rc1, 0.9.0-beta.1)

permissions:
  contents: write  # Required for creating GitHub releases
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/^version = .*/version = "${{ steps.version.outputs.version }}"/' pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: set version to ${{ steps.version.outputs.version }} for release build"
          echo "Updated and committed version ${{ steps.version.outputs.version }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build wheel
        run: make clean-dist wheel
        env:
          UV: uv
          UVX: uvx

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  test-wheel:
    name: Test built wheel
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test wheel in container
        run: |
          echo "Testing wheel: $(ls dist/*.whl)"
          bin/runc_wheel dist/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    needs: test-wheel
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if changelog exists
        id: changelog
        run: |
          CHANGELOG_FILE="docs/changelogs/${{ steps.version.outputs.version }}.rst"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: Changelog file $CHANGELOG_FILE not found"
          fi

      - name: Install pandoc
        if: steps.changelog.outputs.exists == 'true'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert changelog to Markdown
        if: steps.changelog.outputs.exists == 'true'
        run: |
          pandoc --wrap=none -s -o changes.md "${{ steps.changelog.outputs.file }}"
          echo "Generated changes.md from ${{ steps.changelog.outputs.file }}"

      - name: Create fallback changelog
        if: steps.changelog.outputs.exists == 'false'
        run: |
          cat > changes.md <<EOF
          # Release ${{ steps.version.outputs.version }}

          This release was automatically created from tag ${{ github.ref_name }}.

          ## Installation

          \`\`\`bash
          pip install harp-proxy==${{ steps.version.outputs.version }}
          \`\`\`

          See the [documentation](https://docs.harp-proxy.net/) for more information.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
