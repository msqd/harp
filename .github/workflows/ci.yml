name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: "1"
  DOCKER_CLI_EXPERIMENTAL: enabled
  GIT_FETCH_EXTRA_FLAGS: --tags
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_TAGS: ${{ github.sha }}-${{ github.run_number }}
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        id: version
        run: echo "VERSION=$(git describe 2>/dev/null || git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  build-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        id: version
        run: echo "VERSION=$(git describe 2>/dev/null || git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_DEV }}:${{ steps.version.outputs.VERSION }}-dev
            ${{ env.DOCKER_IMAGE_DEV }}:${{ env.DOCKER_TAGS }}-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  test-backend-core:
    runs-on: ubuntu-latest
    needs: build-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run core tests
        run: make testc-backend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          PYTEST_TARGETS: harp
          PYTEST_OPTIONS: -m 'not subprocess'

  test-backend-apps:
    runs-on: ubuntu-latest
    needs: build-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run apps tests
        run: make testc-backend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          PYTEST_TARGETS: harp_apps
          PYTEST_OPTIONS: -m 'not subprocess'
          PYTEST_CPUS: "1"

  test-backend-e2e:
    runs-on: ubuntu-latest
    needs: build-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run e2e tests
        run: make testc-backend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          PYTEST_TARGETS: tests
          PYTEST_OPTIONS: -m 'not subprocess'
          PYTEST_CPUS: "1"

  test-frontend-unit:
    runs-on: ubuntu-latest
    needs: build-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run frontend unit tests
        run: make ci-test-frontend-unit
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.sha }}-${{ github.run_number }}-dev

  # Commented out - same as in .gitlab-ci.yml
  # test-frontend-browser:
  #   runs-on: ubuntu-latest
  #   needs: build-dev
  #   container:
  #     image: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
  #   steps:
  #     - name: Run frontend browser tests
  #       run: (cd /opt/harp/src/harp_apps/dashboard/frontend; pnpm test:browser)

  # test-frontend-visual:
  #   runs-on: ubuntu-latest
  #   needs: build-dev
  #   container:
  #     image: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
  #   steps:
  #     - name: Run visual tests
  #       run: (cd /opt/harp/src; bin/runc_visualtests pnpm test:ui:dev)

  doc-html:
    runs-on: ubuntu-latest
    needs: build-dev
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SPHINXBUILD: /opt/venv/bin/sphinx-build
    steps:
      - name: Build documentation
        run: |
          (cd /opt/harp/src/docs; make html)
          mv /opt/harp/src/docs/_build/html harp-doc

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harp-doc
          path: harp-doc/
          retention-days: 30

  storybook:
    runs-on: ubuntu-latest
    needs: build-dev
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Build storybook
        run: |
          (cd /opt/harp/src/harp_apps/dashboard/frontend; pnpm ui:build)
          mv /opt/harp/src/harp_apps/dashboard/frontend/build harp-ui

      - name: Upload storybook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harp-ui
          path: harp-ui/
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs:
      - build-runtime
      - test-backend-core
      - test-backend-apps
      - test-backend-e2e
      - test-frontend-unit
    # Only run on version branches (e.g., 1.0) or tags
    if: |
      (github.ref_type == 'branch' && contains(github.ref_name, '.') && !contains(github.ref_name, '/')) ||
      github.ref_type == 'tag'
    permissions:
      contents: read
      packages: read
    env:
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull source image
        run: docker pull ${SOURCE_IMAGE}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push images
        run: |
          echo "GITHUB_REF_TYPE = ${{ github.ref_type }}"
          echo "GITHUB_REF_NAME = ${{ github.ref_name }}"

          # For branches (e.g., 1.0, 2.1)
          if [ "${{ github.ref_type }}" = "branch" ]; then
            docker tag ${SOURCE_IMAGE} makersquad/harp-proxy:${{ github.ref_name }}-git
            docker push makersquad/harp-proxy:${{ github.ref_name }}-git
          fi

          # For tags
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag ${SOURCE_IMAGE} makersquad/harp-proxy:${{ github.ref_name }}
            docker push makersquad/harp-proxy:${{ github.ref_name }}

            # If it's a semver tag (x.y.z), also tag as latest
            if echo "${{ github.ref_name }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              docker tag ${SOURCE_IMAGE} makersquad/harp-proxy:latest
              docker push makersquad/harp-proxy:latest
            fi
          fi
