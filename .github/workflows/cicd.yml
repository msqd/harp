name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'      # Semantic version tags (e.g., 0.9.0)
      - '*.*.*-*'    # Pre-release tags (e.g., 0.9.0-rc1, 0.9.0-beta.1)
  pull_request:
  # Dry run: builds and smoke-tests the image, never pushes.
  workflow_dispatch:

# Least privilege: every job declares what it needs. No job pushes with the checkout credentials.
permissions: {}

env:
  DOCKER_BUILDKIT: "1"
  DOCKER_CLI_EXPERIMENTAL: enabled
  GIT_FETCH_EXTRA_FLAGS: --tags
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_TAGS: ${{ github.sha }}-${{ github.run_number }}
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}

jobs:
  # Runs before every job that calls `uv sync`, because `uv sync` reconciles a stale uv.lock in
  # place and says nothing: without this gate, CI is green on a lockfile that disagrees with
  # pyproject.toml, and everyone who syncs gets a dirty working tree they did not create.
  # See https://github.com/msqd/harp/issues/935.
  check-lockfile:
    name: Check Lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: uv.lock is up to date with pyproject.toml (if this fails, run `uv lock` and commit)
        run: uv lock --check

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    needs: check-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check (if this fails, run `make format` and fix what remains)
        run: uv run ruff check harp harp_apps tests

      - name: ruff format --check (if this fails, run `make format` and commit)
        run: uv run ruff format --check harp harp_apps tests

  # Generated schemas and types are committed: regenerating them on unmodified code must change nothing.
  check-types:
    name: Check Generated Types
    runs-on: ubuntu-latest
    needs: check-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: harp_apps/dashboard/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          uv sync --locked
          cd harp_apps/dashboard/frontend && pnpm install --ignore-workspace

      - name: Generate types
        run: |
          uv run bin/generate_types
          uv run bin/generate_ts_types
          cd harp_apps/dashboard/frontend && pnpm prettier -w src/Models

      - name: Generated files are committed (if this fails, run `make types` and commit)
        run: git status --porcelain --untracked-files=all | tee /dev/stderr | { ! grep -q .; }

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: harp_apps/dashboard/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd harp_apps/dashboard/frontend && pnpm install --ignore-workspace

      - name: pnpm lint (if this fails, run `make lint-frontend` locally)
        run: cd harp_apps/dashboard/frontend && pnpm lint

  # Fails on a ${{ }} expression pasted into a run: script (template injection). Rules: .github/zizmor.yml
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: zizmor (if this fails, run `uvx zizmor@1.14.2 --offline .github` locally)
        run: uvx zizmor@1.14.2 --offline .github

  # Fails a pull request that adds a dependency with a high or critical advisory (runtime scope only).
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Only meaningful on a pull request (needs a base to diff against); a step-level condition keeps the
      # job green on pushes, so the gate can require it unconditionally.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  # Fails on any known advisory in the locked Python dependencies (dev tools included).
  audit-python:
    name: Audit uv.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Export locked requirements
        run: uv export --frozen --all-extras --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"

      - name: pip-audit (if this fails, bump the vulnerable pin and run `uv lock`)
        run: uvx pip-audit==2.9.0 --disable-pip --no-deps --strict -r "$RUNNER_TEMP/requirements.txt"

  # Fails on any high or critical advisory in the locked frontend dependencies.
  audit-frontend:
    name: Audit pnpm-lock.yaml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: pnpm audit (if this fails, bump the vulnerable package and refresh pnpm-lock.yaml)
        run: cd harp_apps/dashboard/frontend && pnpm audit --audit-level high

  # Fails when a secret is committed: the same hooks as `pre-commit`, pinned to SHAs in .pre-commit-config.yaml.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: pre-commit (if this fails, run `uvx pre-commit run --all-files` locally)
        run: uvx pre-commit==4.3.0 run --all-files --show-diff-on-failure

  test-backend-core:
    name: Test Backend Core (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: check-lockfile
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync --locked

      - name: Run core tests
        run: uv run pytest harp -n auto -m 'not subprocess'
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  test-backend-apps:
    name: Test Backend Apps (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: check-lockfile
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync --locked

      - name: Run apps tests
        run: uv run pytest harp_apps -n 1 -m 'not subprocess'
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          TEST_DATABASE_DIALECTS: sqlite,postgresql  # mysql has its own job

  test-backend-e2e:
    name: Test Backend E2E (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: check-lockfile
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync --locked

      - name: Run e2e tests
        run: uv run pytest tests -n 1 -m 'not subprocess'
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          TEST_DATABASE_DIALECTS: sqlite,postgresql  # mysql has its own job

  # Storage suite against live MySQL (mysql:8-oracle) and MariaDB (mariadb:lts) through aiomysql.
  # See https://github.com/msqd/harp/issues/868.
  test-backend-mysql:
    name: Test Backend MySQL
    runs-on: ubuntu-latest
    needs: check-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync --locked

      - name: Run storage and proxy-with-storage tests on MySQL and MariaDB
        run: uv run pytest harp_apps/storage harp_apps/proxy/tests/with_storage -n auto -m 'not subprocess'
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          TEST_DATABASE_DIALECTS: mysql

  # Tests that spawn real processes: uv run / uvx harp-proxy, python -m harp, the wheel, harp create project.
  # See https://github.com/msqd/harp/issues/921.
  test-backend-subprocess:
    name: Test Backend Subprocess
    runs-on: ubuntu-latest
    needs: check-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync --locked

      - name: Run subprocess tests
        run: uv run pytest -m subprocess -n auto -v
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  test-frontend-unit:
    name: Test Frontend Unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: harp_apps/dashboard/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd harp_apps/dashboard/frontend && pnpm install --ignore-workspace

      - name: Run frontend unit tests
        run: cd harp_apps/dashboard/frontend && pnpm test:unit

  build-documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: check-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync --locked

      - name: Build documentation
        run: make docs

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harp-doc
          path: docs/_build/html/
          retention-days: 30

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: harp_apps/dashboard/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd harp_apps/dashboard/frontend && pnpm install --ignore-workspace

      - name: Build storybook
        run: cd harp_apps/dashboard/frontend && pnpm ui:build

      - name: Upload storybook artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harp-ui
          path: harp_apps/dashboard/frontend/build/
          retention-days: 30

  # Python package build - runs in parallel with tests
  build-python-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Extract version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "Building release version: $VERSION"
          else
            VERSION=$(git describe --tags --always --dirty)
            echo "Building development version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate version matches tag
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x bin/validate_version
          bin/validate_version "$VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Build wheel
        # Note: We use 'make wheel' instead of 'uv build' because:
        # 1. Builds in an isolated sandbox environment for reproducibility
        # 2. Builds and bundles the React frontend
        # 3. Strips unnecessary content from README.rst
        # 4. Validates the wheel with twine
        run: make clean-dist wheel
        env:
          UV: uv
          UVX: uvx

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  # The built wheel installs and runs on a clean Python.
  test-python-package:
    name: Test Python Package (Py${{ matrix.python-version }})
    needs: build-python-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Test wheel installation
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "Testing wheel: $WHEEL on Python $PYTHON_VERSION"
          uv pip install --system "$WHEEL"
          python -c "import harp; print(f'HARP version: {harp.__version__}')"
          python -c "import sys; print(f'Python: {sys.version}')"

      - name: Run the installed wheel (rules run)
        run: |
          cd "$(mktemp -d)"
          printf 'rules:\n  "*":\n    "*":\n      on_remote_response: |\n        logger.info("hi")\n' > rules.yml
          harp-proxy rules run --help
          harp-proxy rules run -f rules.yml api=http://127.0.0.1:9 GET /

  # The one required status check: fails unless every job it needs succeeded.
  all-checks-passed:
    name: All Checks Passed
    needs:
      - check-lockfile
      - build-python-package
      - test-python-package
      - test-backend-core
      - test-backend-apps
      - test-backend-e2e
      - test-backend-mysql
      - test-backend-subprocess
      - test-frontend-unit
      - lint-python
      - lint-frontend
      - check-types
      - lint-workflows
      - dependency-review
      - audit-python
      - audit-frontend
      - pre-commit
      - build-documentation
      - build-storybook
    # always() so a failed need fails the gate instead of skipping it (a skipped required check passes)
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

      - name: All checks passed
        run: echo "✅ All tests and package builds completed successfully"

  # Docker image from the CI wheel (non-release branches). Built, started, then pushed as is.
  build-docker-image-development:
    name: Build Docker Image (Development)
    needs: all-checks-passed
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Export uv.lock as the image constraints
        run: uv run --locked --no-dev python bin/check_docker_lock.py export > dist/constraints.txt

      - name: Determine version and tags
        id: meta
        run: |
          # main publishes "unstable"; version branches (e.g., 0.9) publish "0.9-git"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAGS="ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA"
            PUSH="false"
            echo "Docker tags (dry run): $TAGS (push disabled)"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            TAGS="ghcr.io/$GITHUB_REPOSITORY:unstable,makersquad/harp-proxy:unstable"
            PUSH="true"
            echo "Docker tags (main): $TAGS"
          elif echo "$GITHUB_REF_NAME" | grep -qE '^[0-9]+\.[0-9]+$'; then
            TAGS="ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME-git,makersquad/harp-proxy:$GITHUB_REF_NAME-git"
            PUSH="true"
            echo "Docker tags (version branch): $TAGS"
          else
            TAGS="ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA"
            PUSH="false"
            echo "Docker tags (other branch): $TAGS (push disabled for non-mainline branches)"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "push=$PUSH" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bin/smoke_docker_image "${TAGS%%,*}"

      - name: Image ships exactly uv.lock
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: uv run --locked --no-dev python bin/check_docker_lock.py check "${TAGS%%,*}"

      - name: Push the tested Docker image
        if: steps.meta.outputs.push == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS//,/ }; do
            docker push "$tag"
          done

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: all-checks-passed
    runs-on: ubuntu-latest
    # Only publish to PyPI for release tags (including pre-releases like rc1, beta1)
    if: github.ref_type == 'tag'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Docker image from the CI wheel (release tags only). Built, started, then pushed as is.
  build-docker-image-release:
    name: Build Docker Image (Release)
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Export uv.lock as the image constraints
        run: uv run --locked --no-dev python bin/check_docker_lock.py export > dist/constraints.txt

      - name: Determine version and tags
        id: meta
        run: |
          VERSION="$GITHUB_REF_NAME"

          # Determine Docker tags based on version format
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # Mainline release (e.g., 0.9.0) - tag with full, minor, and major versions
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f1-2)
            TAGS="ghcr.io/$GITHUB_REPOSITORY:$VERSION,makersquad/harp-proxy:$VERSION"
            TAGS="$TAGS,ghcr.io/$GITHUB_REPOSITORY:$MINOR,makersquad/harp-proxy:$MINOR"
            TAGS="$TAGS,ghcr.io/$GITHUB_REPOSITORY:$MAJOR,makersquad/harp-proxy:$MAJOR"
            # `latest` tracks the most recent mainline stable release (pre-releases are excluded by
            # the branch above). Previously pinned to 0.9.x, which would have frozen `latest` at 0.9.
            TAGS="$TAGS,makersquad/harp-proxy:latest"
            echo "Docker tags (mainline): $TAGS"
          else
            # Pre-release (e.g., 0.9.0-rc1) - only exact tag
            TAGS="ghcr.io/$GITHUB_REPOSITORY:$VERSION,makersquad/harp-proxy:$VERSION"
            echo "Docker tags (pre-release): $TAGS"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bin/smoke_docker_image "${TAGS%%,*}"

      - name: Image ships exactly uv.lock
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: uv run --locked --no-dev python bin/check_docker_lock.py check "${TAGS%%,*}"

      - name: Push the tested Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS//,/ }; do
            docker push "$tag"
          done

  create-github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if changelog exists
        id: changelog
        env:
          VERSION_OUT: ${{ steps.version.outputs.version }}
        run: |
          VERSION="$VERSION_OUT"
          if [[ "$VERSION" == *-* ]]; then
            # A pre-release does not consume the fragments: its notes are the fragments present at the tag.
            if ls changelog.d/*.*.rst 2>/dev/null | grep -qv README.rst; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "pending=true" >> $GITHUB_OUTPUT
              echo "file=pending.rst" >> $GITHUB_OUTPUT
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "Warning: no changelog fragment in changelog.d/"
            fi
          else
            CHANGELOG_FILE="docs/changelogs/$VERSION.rst"
            if [ -f "$CHANGELOG_FILE" ]; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "Warning: Changelog file $CHANGELOG_FILE not found"
            fi
          fi

      - name: Install pandoc
        if: steps.changelog.outputs.exists == 'true'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install uv
        if: steps.changelog.outputs.pending == 'true'
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Render pre-release notes from fragments
        if: steps.changelog.outputs.pending == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.file }}
        run: |
          uvx --from "towncrier>=26.9.0" towncrier build --draft --version "${VERSION%%-*}" --date "$(date +%F)" > "$CHANGELOG_FILE"

      - name: Convert changelog to Markdown
        if: steps.changelog.outputs.exists == 'true'
        env:
          CHANGELOG_FILE: ${{ steps.changelog.outputs.file }}
        run: |
          pandoc --wrap=none --shift-heading-level-by=-1 -o changes.md "$CHANGELOG_FILE"
          echo "Generated changes.md from $CHANGELOG_FILE"

      - name: Create fallback changelog
        if: steps.changelog.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > changes.md <<'EOF'
          # Release $VERSION

          This release was automatically created from tag $GITHUB_REF_NAME.

          ## Installation

          ```bash
          pip install harp-proxy==$VERSION
          ```

          See the [documentation](https://docs.harp-project.net/) for more information.
          EOF
          envsubst '$VERSION $GITHUB_REF_NAME' < changes.md > changes.md.tmp
          mv changes.md.tmp changes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: changes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
