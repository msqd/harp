name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'      # Semantic version tags (e.g., 0.9.0)
      - '*.*.*-*'    # Pre-release tags (e.g., 0.9.0-rc1, 0.9.0-beta.1)
  pull_request:

permissions:
  contents: write   # Required for creating GitHub releases
  packages: write   # Required for pushing to GHCR
  id-token: write   # Required for trusted publishing to PyPI

env:
  DOCKER_BUILDKIT: "1"
  DOCKER_CLI_EXPERIMENTAL: enabled
  GIT_FETCH_EXTRA_FLAGS: --tags
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_TAGS: ${{ github.sha }}-${{ github.run_number }}
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        id: version
        run: echo "VERSION=$(git describe 2>/dev/null || git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  build-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        id: version
        run: echo "VERSION=$(git describe 2>/dev/null || git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_DEV }}:${{ steps.version.outputs.VERSION }}-dev
            ${{ env.DOCKER_IMAGE_DEV }}:${{ env.DOCKER_TAGS }}-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  test-backend-core:
    runs-on: ubuntu-latest
    needs: build-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run core tests
        run: make testc-backend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          PYTEST_TARGETS: harp
          PYTEST_OPTIONS: -m 'not subprocess'

  test-backend-apps:
    runs-on: ubuntu-latest
    needs: build-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run apps tests
        run: make testc-backend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          PYTEST_TARGETS: harp_apps
          PYTEST_OPTIONS: -m 'not subprocess'
          PYTEST_CPUS: "1"

  test-backend-e2e:
    runs-on: ubuntu-latest
    needs: build-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run e2e tests
        run: make testc-backend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          PYTEST_TARGETS: tests
          PYTEST_OPTIONS: -m 'not subprocess'
          PYTEST_CPUS: "1"

  test-frontend-unit:
    runs-on: ubuntu-latest
    needs: build-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run frontend unit tests
        run: make testc-frontend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          DOCKER_INTERACTIVE: ""

  doc-html:
    runs-on: ubuntu-latest
    needs: build-dev
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: |
          mkdir -p harp-doc
          chmod 777 harp-doc
          docker run --rm \
            -v $PWD/harp-doc:/opt/harp/src/docs/_build \
            -e SPHINXBUILD=/opt/venv/bin/sphinx-build \
            ${{ env.DOCKER_IMAGE_DEV }} \
            bash -c "cd /opt/harp/src/docs && make html"

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harp-doc
          path: harp-doc/html/
          retention-days: 30

  storybook:
    runs-on: ubuntu-latest
    needs: build-dev
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build storybook
        run: |
          mkdir -p harp-ui
          chmod 777 harp-ui
          docker run --rm \
            -v $PWD/harp-ui:/opt/harp/src/harp_apps/dashboard/frontend/build \
            ${{ env.DOCKER_IMAGE_DEV }} \
            bash -c "cd /opt/harp/src/harp_apps/dashboard/frontend && pnpm ui:build"

      - name: Upload storybook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harp-ui
          path: harp-ui/
          retention-days: 30

  docker-release:
    runs-on: ubuntu-latest
    needs:
      - build-runtime
      - test-backend-core
      - test-backend-apps
      - test-backend-e2e
      - test-frontend-unit
    # Only run on version branches (e.g., 1.0) or tags
    if: |
      (github.ref_type == 'branch' && contains(github.ref_name, '.') && !contains(github.ref_name, '/')) ||
      github.ref_type == 'tag'
    permissions:
      contents: read
      packages: read
    env:
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull source image
        run: docker pull ${SOURCE_IMAGE}

      - name: Log in to Docker Hub
        continue-on-error: true
        id: dockerhub_login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push images to Docker Hub
        if: steps.dockerhub_login.outcome == 'success'
        run: |
          echo "GITHUB_REF_TYPE = ${{ github.ref_type }}"
          echo "GITHUB_REF_NAME = ${{ github.ref_name }}"

          # For branches (e.g., 1.0, 2.1)
          if [ "${{ github.ref_type }}" = "branch" ]; then
            docker tag ${SOURCE_IMAGE} makersquad/harp-proxy:${{ github.ref_name }}-git
            docker push makersquad/harp-proxy:${{ github.ref_name }}-git
          fi

          # For tags
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag ${SOURCE_IMAGE} makersquad/harp-proxy:${{ github.ref_name }}
            docker push makersquad/harp-proxy:${{ github.ref_name }}

            # If it's a semver tag (x.y.z), also tag as latest
            if echo "${{ github.ref_name }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              docker tag ${SOURCE_IMAGE} makersquad/harp-proxy:latest
              docker push makersquad/harp-proxy:latest
            fi
          fi

  # Python package release jobs - only run on tags
  build-python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    # Only run on version tags
    if: github.ref_type == 'tag' && startsWith(github.ref_name, '0.') || startsWith(github.ref_name, '1.') || startsWith(github.ref_name, '2.')
    needs:
      - test-backend-core
      - test-backend-apps
      - test-backend-e2e
      - test-frontend-unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Validate version matches tag
        run: |
          chmod +x bin/validate_version
          bin/validate_version "${{ steps.version.outputs.version }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build wheel
        # Note: We use 'make wheel' instead of 'uv build' because:
        # 1. Builds in an isolated sandbox environment for reproducibility
        # 2. Builds and bundles the React frontend
        # 3. Strips unnecessary content from README.rst
        # 4. Validates the wheel with twine
        run: make clean-dist wheel
        env:
          UV: uv
          UVX: uvx

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  test-python-package:
    name: Test built wheel (Python ${{ matrix.python-version }}${{ matrix.python-gil && '-nogil' || '' }})
    needs: build-python-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
          - python-version: '3.14'
          - python-version: '3.14'
            python-gil: 'free-threaded'  # Python 3.14t (no-GIL)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Test wheel installation
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "Testing wheel: $WHEEL on Python ${{ matrix.python-version }}${{ matrix.python-gil && ' (free-threaded)' || '' }}"
          uv pip install --system "$WHEEL"
          python -c "import harp; print(f'HARP version: {harp.__version__}')"
          python -c "import sys; print(f'Python: {sys.version}')"
          ${{ matrix.python-gil && 'python -c "import sys; print(f\"GIL enabled: {sys._is_gil_enabled()}\")"' || 'echo "GIL enabled (standard Python)"' }}

  publish-testpypi:
    name: Publish to TestPyPI
    needs: test-python-package
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if changelog exists
        id: changelog
        run: |
          CHANGELOG_FILE="docs/changelogs/${{ steps.version.outputs.version }}.rst"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: Changelog file $CHANGELOG_FILE not found"
          fi

      - name: Install pandoc
        if: steps.changelog.outputs.exists == 'true'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert changelog to Markdown
        if: steps.changelog.outputs.exists == 'true'
        run: |
          pandoc --wrap=none -s -o changes.md "${{ steps.changelog.outputs.file }}"
          echo "Generated changes.md from ${{ steps.changelog.outputs.file }}"

      - name: Create fallback changelog
        if: steps.changelog.outputs.exists == 'false'
        run: |
          cat > changes.md <<EOF
          # Release ${{ steps.version.outputs.version }}

          This release was automatically created from tag ${{ github.ref_name }}.

          ## Installation

          \`\`\`bash
          pip install harp-proxy==${{ steps.version.outputs.version }}
          \`\`\`

          See the [documentation](https://docs.harp-proxy.net/) for more information.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
