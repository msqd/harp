name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'      # Semantic version tags (e.g., 0.9.0)
      - '*.*.*-*'    # Pre-release tags (e.g., 0.9.0-rc1, 0.9.0-beta.1)
  pull_request:

permissions:
  contents: write   # Required for creating GitHub releases
  packages: write   # Required for pushing to GHCR
  id-token: write   # Required for trusted publishing to PyPI

env:
  DOCKER_BUILDKIT: "1"
  DOCKER_CLI_EXPERIMENTAL: enabled
  GIT_FETCH_EXTRA_FLAGS: --tags
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_TAGS: ${{ github.sha }}-${{ github.run_number }}
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}

jobs:
  test-backend-core:
    name: Test Backend Core (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync

      - name: Run core tests
        run: uv run pytest harp -n auto -m 'not subprocess'
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  test-backend-apps:
    name: Test Backend Apps (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync

      - name: Run apps tests
        run: uv run pytest harp_apps -n 1 -m 'not subprocess'
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  test-backend-e2e:
    name: Test Backend E2E (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync

      - name: Run e2e tests
        run: uv run pytest tests -n 1 -m 'not subprocess'
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  test-frontend-unit:
    name: Test Frontend Unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: harp_apps/dashboard/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd harp_apps/dashboard/frontend && pnpm install --ignore-workspace

      - name: Run frontend unit tests
        run: cd harp_apps/dashboard/frontend && pnpm test:unit

  build-documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Ensure web directory exists
        run: mkdir -p harp_apps/dashboard/web

      - name: Install dependencies
        run: uv sync

      - name: Build documentation
        run: make docs

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harp-doc
          path: docs/_build/html/
          retention-days: 30

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: harp_apps/dashboard/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd harp_apps/dashboard/frontend && pnpm install --ignore-workspace

      - name: Build storybook
        run: cd harp_apps/dashboard/frontend && pnpm ui:build

      - name: Upload storybook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harp-ui
          path: harp_apps/dashboard/frontend/build/
          retention-days: 30

  # Python package build - runs in parallel with tests
  build-python-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "Building release version: $VERSION"
          else
            VERSION=$(git describe --tags --always --dirty)
            echo "Building development version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate version matches tag
        if: github.ref_type == 'tag'
        run: |
          chmod +x bin/validate_version
          bin/validate_version "${{ steps.version.outputs.version }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build wheel
        # Note: We use 'make wheel' instead of 'uv build' because:
        # 1. Builds in an isolated sandbox environment for reproducibility
        # 2. Builds and bundles the React frontend
        # 3. Strips unnecessary content from README.rst
        # 4. Validates the wheel with twine
        run: make clean-dist wheel
        env:
          UV: uv
          UVX: uvx

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  all-checks-passed:
    name: ${{ (matrix.python-version && format('Test Python Package (Py{0}{1})', matrix.python-version, matrix.python-gil && 't' || '')) || 'All Checks Passed' }}
    needs:
      - build-python-package
      - test-backend-core
      - test-backend-apps
      - test-backend-e2e
      - test-frontend-unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
          - check-only: true  # Consolidation job with no Python testing
    steps:
      - name: All checks passed
        if: matrix.check-only
        run: echo "✅ All tests and package builds completed successfully"

      - name: Checkout code
        if: matrix.python-version
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.python-version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Download wheel artifact
        if: matrix.python-version
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        if: matrix.python-version
        uses: astral-sh/setup-uv@v4

      - name: Test wheel installation
        if: matrix.python-version
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "Testing wheel: $WHEEL on Python ${{ matrix.python-version }}${{ matrix.python-gil && ' (free-threaded)' || '' }}"
          uv pip install --system "$WHEEL"
          python -c "import harp; print(f'HARP version: {harp.__version__}')"
          python -c "import sys; print(f'Python: {sys.version}')"
          ${{ matrix.python-gil && 'python -c "import sys; print(f\"GIL enabled: {sys._is_gil_enabled()}\")"' || 'echo "GIL enabled (standard Python)"' }}

  # Docker image with wheel from local build (non-release branches)
  build-docker-image-development:
    name: Build Docker Image (Development)
    needs: all-checks-passed
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Determine version and tags
        id: meta
        run: |
          # Branch build - use local wheel
          VERSION=$(git describe --tags --always --dirty)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "INSTALL_FROM=local" >> $GITHUB_OUTPUT

          # For version branches (e.g., 0.9), tag as 0.9-git and enable push
          if echo "${{ github.ref_name }}" | grep -qE '^[0-9]+\.[0-9]+$'; then
            TAGS="ghcr.io/${{ github.repository }}:${{ github.ref_name }}-git,makersquad/harp-proxy:${{ github.ref_name }}-git"
            PUSH="true"
            echo "Docker tags (version branch): $TAGS"
          else
            TAGS="ghcr.io/${{ github.repository }}:${{ github.sha }}"
            PUSH="false"
            echo "Docker tags (other branch): $TAGS (push disabled for non-mainline branches)"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "push=$PUSH" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (GIL enabled)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PYTHON_VERSION=3.13
            INSTALL_FROM=${{ steps.meta.outputs.INSTALL_FROM }}
            VERSION=${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: all-checks-passed
    runs-on: ubuntu-latest
    # Only publish to PyPI for release tags (including pre-releases like rc1, beta1)
    if: github.ref_type == 'tag'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Docker image with wheel from PyPI (release tags only)
  build-docker-image-release:
    name: Build Docker Image (Release)
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tags
        id: meta
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "INSTALL_FROM=pypi" >> $GITHUB_OUTPUT

          # Determine Docker tags based on version format
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # Mainline release (e.g., 0.9.0) - tag with full, minor, and major versions
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f1-2)
            TAGS="ghcr.io/${{ github.repository }}:$VERSION,makersquad/harp-proxy:$VERSION"
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:$MINOR,makersquad/harp-proxy:$MINOR"
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:$MAJOR,makersquad/harp-proxy:$MAJOR"
            # Only add latest tag for version 0.9.x releases
            if echo "$VERSION" | grep -qE '^0\.9\.[0-9]+$'; then
              TAGS="$TAGS,makersquad/harp-proxy:latest"
            fi
            echo "Docker tags (mainline): $TAGS"
          else
            # Pre-release (e.g., 0.9.0-rc1) - only exact tag
            TAGS="ghcr.io/${{ github.repository }}:$VERSION,makersquad/harp-proxy:$VERSION"
            echo "Docker tags (pre-release): $TAGS"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (GIL enabled)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pypi
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PYTHON_VERSION=3.13
            VERSION=${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if changelog exists
        id: changelog
        run: |
          CHANGELOG_FILE="docs/changelogs/${{ steps.version.outputs.version }}.rst"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: Changelog file $CHANGELOG_FILE not found"
          fi

      - name: Install pandoc
        if: steps.changelog.outputs.exists == 'true'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert changelog to Markdown
        if: steps.changelog.outputs.exists == 'true'
        run: |
          pandoc --wrap=none -s -o changes.md "${{ steps.changelog.outputs.file }}"
          echo "Generated changes.md from ${{ steps.changelog.outputs.file }}"

      - name: Create fallback changelog
        if: steps.changelog.outputs.exists == 'false'
        run: |
          cat > changes.md <<EOF
          # Release ${{ steps.version.outputs.version }}

          This release was automatically created from tag ${{ github.ref_name }}.

          ## Installation

          \`\`\`bash
          pip install harp-proxy==${{ steps.version.outputs.version }}
          \`\`\`

          See the [documentation](https://docs.harp-proxy.net/) for more information.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
