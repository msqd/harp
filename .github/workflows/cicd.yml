name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'      # Semantic version tags (e.g., 0.9.0)
      - '*.*.*-*'    # Pre-release tags (e.g., 0.9.0-rc1, 0.9.0-beta.1)
  pull_request:

permissions:
  contents: write   # Required for creating GitHub releases
  packages: write   # Required for pushing to GHCR
  id-token: write   # Required for trusted publishing to PyPI

env:
  DOCKER_BUILDKIT: "1"
  DOCKER_CLI_EXPERIMENTAL: enabled
  GIT_FETCH_EXTRA_FLAGS: --tags
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_TAGS: ${{ github.sha }}-${{ github.run_number }}
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}

jobs:
  build-runtime-image:
    name: Build Runtime Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        id: version
        run: echo "VERSION=$(git describe 2>/dev/null || git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  build-development-image:
    name: Build Development Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        id: version
        run: echo "VERSION=$(git describe 2>/dev/null || git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_DEV }}:${{ steps.version.outputs.VERSION }}-dev
            ${{ env.DOCKER_IMAGE_DEV }}:${{ env.DOCKER_TAGS }}-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  test-backend-core:
    name: Test Backend Core
    runs-on: ubuntu-latest
    needs: build-development-image
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run core tests
        run: make testc-backend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          PYTEST_TARGETS: harp
          PYTEST_OPTIONS: -m 'not subprocess'

  test-backend-apps:
    name: Test Backend Apps
    runs-on: ubuntu-latest
    needs: build-development-image
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run apps tests
        run: make testc-backend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          PYTEST_TARGETS: harp_apps
          PYTEST_OPTIONS: -m 'not subprocess'
          PYTEST_CPUS: "1"

  test-backend-e2e:
    name: Test Backend E2E
    runs-on: ubuntu-latest
    needs: build-development-image
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run e2e tests
        run: make testc-backend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          PYTEST_TARGETS: tests
          PYTEST_OPTIONS: -m 'not subprocess'
          PYTEST_CPUS: "1"

  test-frontend-unit:
    name: Test Frontend Unit
    runs-on: ubuntu-latest
    needs: build-development-image
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run frontend unit tests
        run: make testc-frontend
        env:
          DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
          DOCKER_INTERACTIVE: ""

  build-documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: build-development-image
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: |
          mkdir -p harp-doc
          chmod 777 harp-doc
          docker run --rm \
            -v $PWD/harp-doc:/opt/harp/src/docs/_build \
            -e SPHINXBUILD=/opt/venv/bin/sphinx-build \
            ${{ env.DOCKER_IMAGE_DEV }} \
            bash -c "cd /opt/harp/src/docs && make html"

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harp-doc
          path: harp-doc/html/
          retention-days: 30

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: build-development-image
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_IMAGE_DEV: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ github.run_number }}-dev
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build storybook
        run: |
          mkdir -p harp-ui
          chmod 777 harp-ui
          docker run --rm \
            -v $PWD/harp-ui:/opt/harp/src/harp_apps/dashboard/frontend/build \
            ${{ env.DOCKER_IMAGE_DEV }} \
            bash -c "cd /opt/harp/src/harp_apps/dashboard/frontend && pnpm ui:build"

      - name: Upload storybook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harp-ui
          path: harp-ui/
          retention-days: 30

  # Python package build - runs in parallel with tests
  build-python-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: build-development-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "Building release version: $VERSION"
          else
            VERSION=$(git describe --tags --always --dirty)
            echo "Building development version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate version matches tag
        if: github.ref_type == 'tag'
        run: |
          chmod +x bin/validate_version
          bin/validate_version "${{ steps.version.outputs.version }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build wheel
        # Note: We use 'make wheel' instead of 'uv build' because:
        # 1. Builds in an isolated sandbox environment for reproducibility
        # 2. Builds and bundles the React frontend
        # 3. Strips unnecessary content from README.rst
        # 4. Validates the wheel with twine
        run: make clean-dist wheel
        env:
          UV: uv
          UVX: uvx

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  all-checks-passed:
    name: ${{ (matrix.python-version && format('Test Python Package (Py{0}{1})', matrix.python-version, matrix.python-gil && 't' || '')) || 'All Checks Passed' }}
    needs:
      - build-python-package
      - test-backend-core
      - test-backend-apps
      - test-backend-e2e
      - test-frontend-unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
          - python-version: '3.14'
          - python-version: '3.14'
            python-gil: 'free-threaded'  # Python 3.14t (no-GIL)
          - check-only: true  # Consolidation job with no Python testing
    steps:
      - name: All checks passed
        if: matrix.check-only
        run: echo "✅ All tests and package builds completed successfully"

      - name: Checkout code
        if: matrix.python-version
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.python-version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Download wheel artifact
        if: matrix.python-version
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        if: matrix.python-version
        uses: astral-sh/setup-uv@v4

      - name: Test wheel installation
        if: matrix.python-version
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "Testing wheel: $WHEEL on Python ${{ matrix.python-version }}${{ matrix.python-gil && ' (free-threaded)' || '' }}"
          uv pip install --system "$WHEEL"
          python -c "import harp; print(f'HARP version: {harp.__version__}')"
          python -c "import sys; print(f'Python: {sys.version}')"
          ${{ matrix.python-gil && 'python -c "import sys; print(f\"GIL enabled: {sys._is_gil_enabled()}\")"' || 'echo "GIL enabled (standard Python)"' }}

  # Docker image with wheel from local build (non-release branches)
  build-docker-image-development:
    name: Build Docker Image (Development)
    needs: all-checks-passed
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Determine version and tags
        id: meta
        run: |
          # Branch build - use local wheel
          VERSION=$(git describe --tags --always --dirty)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "INSTALL_FROM=local" >> $GITHUB_OUTPUT

          # For version branches (e.g., 0.9), tag as 0.9-git
          if echo "${{ github.ref_name }}" | grep -qE '^[0-9]+\.[0-9]+$'; then
            TAGS="ghcr.io/${{ github.repository }}:${{ github.ref_name }}-git"
            echo "Docker tags (version branch): $TAGS"
          else
            TAGS="ghcr.io/${{ github.repository }}:${{ github.sha }}"
            echo "Docker tags (other branch): $TAGS"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dockerfile for wheel installation
        run: |
          cat > Dockerfile.wheel <<'EOF'
          ARG PYTHON_VERSION=3.14
          FROM python:${PYTHON_VERSION}-slim

          WORKDIR /app

          # Install system dependencies
          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                build-essential \
                libpq-dev \
                && rm -rf /var/lib/apt/lists/*

          # Copy and install wheel
          ARG INSTALL_FROM=local
          ARG VERSION

          COPY dist/*.whl /tmp/

          RUN if [ "$INSTALL_FROM" = "pypi" ]; then \
                echo "Installing from PyPI: harp-proxy==$VERSION"; \
                pip install --no-cache-dir "harp-proxy==$VERSION"; \
              else \
                echo "Installing from local wheel"; \
                pip install --no-cache-dir /tmp/*.whl; \
              fi && \
              rm -rf /tmp/*.whl

          # Create non-root user
          RUN useradd -m -u 1000 harp && \
              chown -R harp:harp /app

          USER harp

          EXPOSE 4000-4999

          ENTRYPOINT ["harp-proxy"]
          CMD ["--help"]
          EOF

      - name: Build and push Docker image (GIL enabled)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wheel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PYTHON_VERSION=3.14
            INSTALL_FROM=${{ steps.meta.outputs.INSTALL_FROM }}
            VERSION=${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate -nogil tags
        id: nogil_tags
        run: |
          ORIGINAL_TAGS="${{ steps.meta.outputs.tags }}"
          NOGIL_TAGS=$(echo "$ORIGINAL_TAGS" | sed 's/\(:[^,]*\)/\1-nogil/g')
          echo "tags=$NOGIL_TAGS" >> $GITHUB_OUTPUT
          echo "NoGIL tags: $NOGIL_TAGS"

      - name: Build and push Docker image (GIL disabled - nogil)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wheel
          push: true
          tags: ${{ steps.nogil_tags.outputs.tags }}
          build-args: |
            PYTHON_VERSION=3.14t
            INSTALL_FROM=${{ steps.meta.outputs.INSTALL_FROM }}
            VERSION=${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: all-checks-passed
    runs-on: ubuntu-latest
    # Only publish to PyPI for release tags (including pre-releases like rc1, beta1)
    if: github.ref_type == 'tag'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/harp-proxy
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Docker image with wheel from PyPI (release tags only)
  build-docker-image-release:
    name: Build Docker Image (Release)
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tags
        id: meta
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "INSTALL_FROM=pypi" >> $GITHUB_OUTPUT

          # Determine Docker tags based on version format
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # Mainline release (e.g., 0.9.0) - tag with full, minor, and major versions
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f1-2)
            TAGS="ghcr.io/${{ github.repository }}:$VERSION"
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:$MINOR"
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:$MAJOR"
            echo "Docker tags (mainline): $TAGS"
          else
            # Pre-release (e.g., 0.9.0-rc1) - only exact tag
            TAGS="ghcr.io/${{ github.repository }}:$VERSION"
            echo "Docker tags (pre-release): $TAGS"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dockerfile for PyPI installation
        run: |
          cat > Dockerfile.wheel <<'EOF'
          ARG PYTHON_VERSION=3.14
          FROM python:${PYTHON_VERSION}-slim

          WORKDIR /app

          # Install system dependencies
          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                build-essential \
                libpq-dev \
                && rm -rf /var/lib/apt/lists/*

          # Install from PyPI
          ARG VERSION
          RUN echo "Installing from PyPI: harp-proxy==$VERSION" && \
              pip install --no-cache-dir "harp-proxy==$VERSION"

          # Create non-root user
          RUN useradd -m -u 1000 harp && \
              chown -R harp:harp /app

          USER harp

          EXPOSE 4000-4999

          ENTRYPOINT ["harp-proxy"]
          CMD ["--help"]
          EOF

      - name: Build and push Docker image (GIL enabled)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wheel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PYTHON_VERSION=3.14
            VERSION=${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate -nogil tags
        id: nogil_tags
        run: |
          ORIGINAL_TAGS="${{ steps.meta.outputs.tags }}"
          NOGIL_TAGS=$(echo "$ORIGINAL_TAGS" | sed 's/\(:[^,]*\)/\1-nogil/g')
          echo "tags=$NOGIL_TAGS" >> $GITHUB_OUTPUT
          echo "NoGIL tags: $NOGIL_TAGS"

      - name: Build and push Docker image (GIL disabled - nogil)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wheel
          push: true
          tags: ${{ steps.nogil_tags.outputs.tags }}
          build-args: |
            PYTHON_VERSION=3.14t
            VERSION=${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if changelog exists
        id: changelog
        run: |
          CHANGELOG_FILE="docs/changelogs/${{ steps.version.outputs.version }}.rst"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: Changelog file $CHANGELOG_FILE not found"
          fi

      - name: Install pandoc
        if: steps.changelog.outputs.exists == 'true'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert changelog to Markdown
        if: steps.changelog.outputs.exists == 'true'
        run: |
          pandoc --wrap=none -s -o changes.md "${{ steps.changelog.outputs.file }}"
          echo "Generated changes.md from ${{ steps.changelog.outputs.file }}"

      - name: Create fallback changelog
        if: steps.changelog.outputs.exists == 'false'
        run: |
          cat > changes.md <<EOF
          # Release ${{ steps.version.outputs.version }}

          This release was automatically created from tag ${{ github.ref_name }}.

          ## Installation

          \`\`\`bash
          pip install harp-proxy==${{ steps.version.outputs.version }}
          \`\`\`

          See the [documentation](https://docs.harp-proxy.net/) for more information.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
