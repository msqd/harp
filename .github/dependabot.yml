# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # The uv ecosystem updates pyproject.toml and uv.lock together (Check Lockfile), and only reads
  # the root project: the Jinja-templated pyproject.toml of the project cookiecutter is never parsed.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/harp_apps/dashboard/frontend"
    schedule:
      interval: "daily"
