http_cache:
  # Global cache flag (default: true)
  enabled: true

  # Cache transport (default: harp_apps.http_cache.transports.AsyncCacheTransport)
  transport:
    type: harp_apps.http_cache.transports.AsyncCacheTransport

  # Cache policy (default: hishel.SpecificationPolicy with RFC 9111-compliant options)
  policy:
    type: hishel.SpecificationPolicy
    options:
      shared: true  # Shared cache mode
      supported_methods: [GET, HEAD]  # Cacheable methods
      allow_stale: false  # Don't serve stale responses

  # Removal of one entry with PURGE (default: disabled, local peers only)
  purge:
    enabled: false
    allow: ["127.0.0.1"]  # Peer addresses or CIDR ranges, for example ["127.0.0.1", "10.0.0.0/8"]

  # Reclamation of the bans of the invalidation log (defaults shown)
  reclamation:
    grace: 300  # Seconds a ban is kept before it is reclaimed
    bans: 1000  # Bans of each mode a round looks at, at most
    entries: 500  # Entries a round deletes, at most
    rounds: 20  # Rounds a run does, at most (a run is one sweep of the janitor)

  # Cache storage (default: harp_apps.http_cache.storages.AsyncStorage)
  storage:
    base: hishel.AsyncBaseStorage
    type: harp_apps.http_cache.storages.AsyncStorage
    arguments:
      ttl: 86400  # Expire entries 24 hours after they were stored or freshened; null disables
      check_ttl_every: 60.0  # Check for expired entries every 60 seconds
      # Retain responses whose only freshness hint is Last-Modified (RFC 9111 §4.2.2). Off, because
      # the cache key is built from the request URL alone: an upstream that authenticates callers by
      # anything other than the Authorization header would have responses reused across them.
      allow_heuristics: false
