proxy:
  client_read_timeout: 30.0
  enabled: true
  endpoints:
  - controller:
      dispatcher:
        type: IAsyncEventDispatcher
      type: harp_apps.proxy.controllers.HttpProxyController
    description: null
    max_request_body_size: null
    name: my-endpoint
    port: 4000
    remote:
      break_on:
      - network_error
      - unhandled_exception
      check_after: 10.0
      endpoints:
      - liveness:
          type: inherit
        pools:
        - default
        url: https://httpbin.org/
      liveness:
        type: inherit
      min_pool_size: 1
      probe:
        headers: {}
        interval: 10.0
        method: GET
        path: /
        timeout: 10.0
        verify: true
  max_recorded_body_size: 1048576
  max_request_body_size: null
  min_request_body_rate: 1024
  request_body_grace_period: 10.0
  tags:
    max_count: 20
    max_name_length: 64
    max_value_length: 255
  trusted_proxies: []
